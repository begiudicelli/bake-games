<div
  class="bg-gray-900 border border-gray-800 rounded-2xl px-5 py-4 flex items-center justify-between"
>
  <div>
    <p class="text-xs text-gray-500 mb-1">Código da sala</p>
    <p class="font-mono text-white text-sm">{{ roomId() }}</p>
  </div>
  <button
    (click)="copyLink()"
    class="text-sm text-blue-400 hover:text-blue-300 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 rounded px-3 py-2"
    aria-label="Copiar link da sala"
  >
    {{ copied() ? '✓ Copiado!' : 'Copiar link' }}
  </button>
</div>
