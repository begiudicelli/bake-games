<div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
  <h2 class="text-2xl font-bold mb-4">Placar</h2>

  <ng-container *ngIf="roomService.myState() as player">
    <div class="mb-6">
      <h3 class="font-semibold text-lg mb-2 text-gray-300">Seção Superior</h3>
      <div class="space-y-2 mb-3">
        <button *ngFor="let item of scoreCategories.slice(0, 6)"
          (click)="selectCategory(item.category)"
          [disabled]="isCategoryFilled(item.category) || !roomService.canSelectCategory()"
          class="w-full px-3 py-2 text-left rounded-lg transition-all duration-200 flex justify-between items-center"
          [ngClass]="{
            'bg-gray-800 hover:bg-gray-700 border border-gray-700': !isCategoryFilled(item.category),
            'bg-blue-900 border border-blue-700 cursor-default': isCategoryFilled(item.category),
            'opacity-50 cursor-not-allowed': isCategoryFilled(item.category) || !roomService.canSelectCategory()
          }">
          <span class="text-sm">{{ item.name }}</span>
          <span class="font-bold">{{ getScore(item.category) ?? '-' }}</span>
        </button>
      </div>

      <div class="p-2 bg-gray-950 border border-gray-700 rounded-lg text-sm">
        <div class="flex justify-between">
          <span>Total Seção Superior:</span>
          <span class="font-bold">{{ player.upperSectionTotal }}</span>
        </div>
        <div *ngIf="roomService.bonusReached()" class="flex justify-between text-green-400 mt-1">
          <span>Bônus (63+):</span>
          <span class="font-bold">35</span>
        </div>
      </div>
    </div>

    <div class="mb-6">
      <h3 class="font-semibold text-lg mb-2 text-gray-300">Seção Inferior</h3>
      <div class="space-y-2">
        <button *ngFor="let item of scoreCategories.slice(6)"
          (click)="selectCategory(item.category)"
          [disabled]="isCategoryFilled(item.category) || !roomService.canSelectCategory()"
          class="w-full px-3 py-2 text-left rounded-lg transition-all duration-200 flex justify-between items-center"
          [ngClass]="{
            'bg-gray-800 hover:bg-gray-700 border border-gray-700': !isCategoryFilled(item.category),
            'bg-blue-900 border border-blue-700 cursor-default': isCategoryFilled(item.category),
            'opacity-50 cursor-not-allowed': isCategoryFilled(item.category) || !roomService.canSelectCategory()
          }">
          <span class="text-sm">{{ item.name }}</span>
          <span class="font-bold">{{ getScore(item.category) ?? '-' }}</span>
        </button>
      </div>
    </div>

    <div class="p-3 bg-green-900 border border-green-700 rounded-lg">
      <div class="flex justify-between">
        <span class="font-semibold">Pontuação Total:</span>
        <span class="text-2xl font-bold">{{ player.totalScore }}</span>
      </div>
    </div>
  </ng-container>
</div>
